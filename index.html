<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTextile ESG Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">

    <!-- Auth View Container (Login / Register) -->
    <div id="auth-container" class="w-full max-w-md bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
        
        <!-- Login View -->
        <div id="login-view">
            <h2 class="text-2xl font-bold mb-6 text-center text-green-400">Textile ESG Portal</h2>
            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Email Address</label>
                    <input type="email" id="login-email" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Password</label>
                    <input type="password" id="login-password" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" required>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold transition duration-200">Login</button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-400">Account nahi hai? <a href="#" onclick="switchView('register')" class="text-green-400 underline font-semibold">Create a new account</a></p>
        </div>

        <!-- Register View (Hidden by default) -->
        <div id="register-view" class="hidden">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-400">Create ESG Account</h2>
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Email Address</label>
                    <input type="email" id="register-email" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-white" required>
                </div>
                <div>
                    <label class="block text-sm mb-1 text-gray-300">Password</label>
                    <input type="password" id="register-password" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-blue-500 text-white" required>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded font-bold transition duration-200">Register</button>
            </form>
            <p class="mt-4 text-center text-sm text-gray-400">Pehle se account hai? <a href="#" onclick="switchView('login')" class="text-blue-400 underline font-semibold">Login karein</a></p>
        </div>

    </div>

    <!-- Dashboard View Container (Hidden until logged in - ESG Form) -->
    <div id="dashboard-container" class="hidden w-full max-w-xl bg-gray-800 rounded-lg p-6 shadow-lg border border-gray-700">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-green-400">ESG Batch Data Entry</h2>
            <button id="logoutBtn" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-sm font-bold transition">Logout</button>
        </div>

        <form id="esgForm" class="space-y-4">
            <div>
                <label class="block text-sm mb-1 text-gray-300">Weight (numeric)</label>
                <input type="number" step="any" id="batch-weight" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" placeholder="e.g. 1500" required>
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">Carbon Emissions</label>
                <input type="text" id="batch-carbon" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" placeholder="e.g. 120 kg" required>
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">Water Usage</label>
                <input type="text" id="batch-water" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" placeholder="e.g. 500 L" required>
            </div>
            <div>
                <label class="block text-sm mb-1 text-gray-300">Energy Consumption</label>
                <input type="text" id="batch-energy" class="w-full p-3 rounded bg-gray-700 border border-gray-600 focus:outline-none focus:border-green-500 text-white" placeholder="e.g. 300 kWh" required>
            </div>
            <button type="submit" class="w-full bg-green-600 hover:bg-green-700 p-3 rounded font-bold transition duration-200">Save Batch to Database</button>
        </form>
    </div>

    <script>
        // Supabase Initialization
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginView = document.getElementById('login-view');
        const registerView = document.getElementById('register-view');

        // Check Session
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        }
        checkUserSession();

        // View Switching
        function switchView(view) {
            if (view === 'register') {
                loginView.classList.add('hidden');
                registerView.classList.remove('hidden');
            } else {
                registerView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
        }

        // Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert(error.message);
            } else {
                alert("Login Successful!");
                checkUserSession();
            }
        });

        // Register Handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                alert(error.message);
            } else {
                alert("Account created successfully! Ab aap login kar sakte hain.");
                switchView('login');
            }
        });

        // Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkUserSession();
        });

        // ESG Data Form Submission Handler (`esg_batches` table)
        document.getElementById('esgForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('batch-weight').value);
            const carbon = document.getElementById('batch-carbon').value;
            const water = document.getElementById('batch-water').value;
            const energy = document.getElementById('batch-energy').value;

            const { data, error } = await supabase.from('esg_batches').insert([
                { weight: weight, carbon: carbon, water: water, energy: energy }
            ]);

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("ESG Batch data successfully saved to database!");
                document.getElementById('esgForm').reset();
            }
        });
    </script>
</body>
</html>
