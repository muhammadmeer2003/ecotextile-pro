<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTextile Pro - Full Supabase Cloud Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans h-screen flex overflow-hidden">

    <div id="auth-container" class="fixed inset-0 bg-gray-950 z-50 flex items-center justify-center p-4">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-md p-8 shadow-2xl space-y-6">
            <div class="text-center space-y-2">
                <span class="text-2xl font-bold tracking-wider text-emerald-400">EcoTextile Pro</span>
                <p id="auth-subtitle" class="text-xs text-gray-400">Cloud Enterprise Gateway &bull; Supabase Secured</p>
            </div>

            <div id="auth-tabs" class="flex bg-gray-950 p-1 rounded-xl border border-gray-800">
                <button type="button" onclick="switchAuthMode('login')" id="auth-tab-login" class="flex-1 py-2 text-xs font-semibold rounded-lg bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-all">Login</button>
                <button type="button" onclick="switchAuthMode('register')" id="auth-tab-register" class="flex-1 py-2 text-xs font-semibold rounded-lg text-gray-400 hover:text-gray-200 transition-all">Create Account</button>
            </div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
                <div id="name-field-wrapper" class="hidden space-y-1">
                    <label class="block text-xs text-gray-400">Full Name</label>
                    <input type="text" id="reg-name" placeholder="Michael Smith" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="space-y-1">
                    <label class="block text-xs text-gray-400">Email Address</label>
                    <input type="email" id="auth-email" required placeholder="michael@example.com" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>

                <div class="space-y-1">
                    <div class="flex justify-between items-center">
                        <label class="block text-xs text-gray-400">Password</label>
                        <button type="button" id="forgot-link" onclick="switchAuthMode('forgot')" class="text-[11px] text-emerald-400 hover:underline">Forgot Password?</button>
                    </div>
                    <input type="password" id="auth-password" required placeholder="••••••••" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-3 py-2 text-sm text-gray-200 focus:outline-none focus:border-emerald-500">
                </div>

                <div id="auth-error" class="hidden text-xs text-rose-400 bg-rose-950/30 p-2.5 rounded-lg border border-rose-800/50"></div>
                <div id="auth-success" class="hidden text-xs text-emerald-400 bg-emerald-950/30 p-2.5 rounded-lg border border-emerald-800/50"></div>

                <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-emerald-600/20">
                    Sign In to Cloud Portal
                </button>
            </form>
        </div>
    </div>

    <div id="main-app-container" class="flex-1 flex overflow-hidden hidden w-full h-full">

        <aside class="w-64 bg-gray-950 border-r border-gray-800 flex flex-col justify-between hidden md:flex">
            <div>
                <div class="p-6 border-b border-gray-800">
                    <span class="text-xl font-bold tracking-wider text-emerald-400">EcoTextile Pro</span>
                    <span class="block text-xs text-gray-500 mt-1">Supabase Cloud Sync</span>
                </div>
                <nav class="p-4 space-y-1">
                    <button onclick="switchTab('overview')" id="btn-overview" class="tab-btn flex items-center gap-3 w-full px-4 py-2.5 text-sm rounded-lg font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 transition-all">
                        <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Overview
                    </button>
                    <button onclick="switchTab('esg')" id="btn-esg" class="tab-btn flex items-center gap-3 w-full px-4 py-2.5 text-sm rounded-lg font-medium text-gray-400 hover:bg-gray-900 hover:text-gray-200 transition-all">
                        <i data-lucide="leaf" class="w-4 h-4"></i> ESG Calculator & Save
                    </button>
                    <button onclick="switchTab('history')" id="btn-history" class="tab-btn flex items-center gap-3 w-full px-4 py-2.5 text-sm rounded-lg font-medium text-gray-400 hover:bg-gray-900 hover:text-gray-200 transition-all" onclick="loadCloudHistory()">
                        <i data-lucide="database" class="w-4 h-4"></i> Cloud Database Records
                    </button>
                </nav>
            </div>
            <div class="p-4 border-t border-gray-800">
                <button onclick="handleLogout()" class="flex items-center gap-3 w-full px-4 py-2 text-sm text-red-400 hover:bg-red-950/30 rounded-lg transition-colors">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 bg-gray-950 border-b border-gray-800 flex items-center justify-between px-6">
                <span class="text-sm font-semibold text-emerald-400">Supabase Cloud Connected</span>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-600 flex items-center font-bold text-sm justify-center" id="user-avatar-initial">M</div>
                    <span class="text-xs font-medium" id="user-display-name">User</span>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto p-8 space-y-6">
                
                <div id="tab-overview" class="tab-content space-y-6">
                    <h1 class="text-2xl font-bold">Cloud Command Center</h1>
                    <p class="text-sm text-gray-400">Welcome! Your application is fully synced with Supabase cloud database.</p>
                </div>

                <div id="tab-esg" class="tab-content space-y-6 hidden">
                    <h1 class="text-2xl font-bold">ESG Calculator & Cloud Storage</h1>
                    <div class="bg-gray-950 border border-gray-800 p-6 rounded-xl space-y-4 max-w-xl">
                        <div>
                            <label class="block text-xs text-gray
