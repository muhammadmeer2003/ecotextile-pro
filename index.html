<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTextile ESG Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Container -->
    <div class="w-full max-w-md bg-slate-800 rounded-xl shadow-2xl border border-slate-700 p-8">
        
        <!-- Header / Logo -->
        <div class="text-center mb-6">
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tight">EcoTextile ESG</h1>
            <p class="text-sm text-slate-400 mt-1">Enterprise Portal for Textile Reporting</p>
        </div>

        <!-- AUTH SECTION (Login & Register) -->
        <div id="auth-container">
            
            <!-- Login Form -->
            <div id="login-view">
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Email Address</label>
                        <input type="email" id="login-email" class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="name@company.com" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Password</label>
                        <input type="password" id="login-password" class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg">Sign In</button>
                </form>
                <p class="mt-6 text-center text-sm text-slate-400">
                    Don't have an account? <button onclick="switchView('register')" class="text-emerald-400 font-semibold hover:underline">Create account</button>
                </p>
            </div>

            <!-- Register Form (Hidden by default) -->
            <div id="register-view" class="hidden">
                <form id="registerForm" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Email Address</label>
                        <input type="email" id="register-email" class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="name@company.com" required>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Password</label>
                        <input type="password" id="register-password" class="w-full px-4 py-3 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="••••••••" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg">Create Account</button>
                </form>
                <p class="mt-6 text-center text-sm text-slate-400">
                    Already have an account? <button onclick="switchView('login')" class="text-blue-400 font-semibold hover:underline">Sign In</button>
                </p>
            </div>

        </div>

        <!-- DASHBOARD SECTION (Hidden until logged in) -->
        <div id="dashboard-container" class="hidden">
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                <div>
                    <h2 class="text-lg font-bold text-emerald-400">ESG Batch Portal</h2>
                    <p id="user-email-display" class="text-xs text-slate-400 truncate max-w-[200px]"></p>
                </div>
                <button id="logoutBtn" class="bg-rose-600 hover:bg-rose-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition">Logout</button>
            </div>

            <!-- ESG Form Data Entry -->
            <form id="esgForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Weight (numeric)</label>
                    <input type="number" step="any" id="batch-weight" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="e.g. 1500" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Carbon Emissions</label>
                    <input type="text" id="batch-carbon" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="e.g. 120 kg" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Water Usage</label>
                    <input type="text" id="batch-water" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="e.g. 500 L" required>
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-300 mb-1">Energy Consumption</label>
                    <input type="text" id="batch-energy" class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 focus:outline-none focus:border-emerald-500 text-white text-sm" placeholder="e.g. 300 kWh" required>
                </div>
                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-lg transition duration-200 shadow-lg mt-2">Save ESG Batch</button>
            </form>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Supabase Configuration (Yahan apni project ki URL aur Anon Key ensure kar lein)
        const SUPABASE_URL = 'YOUR_SUPABASE_URL'; 
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const authContainer = document.getElementById('auth-container');
        const dashboardContainer = document.getElementById('dashboard-container');
        const loginView = document.getElementById('login-view');
        const registerView = document.getElementById('register-view');

        // Check active session on load
        async function checkUserSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                authContainer.classList.add('hidden');
                dashboardContainer.classList.remove('hidden');
                document.getElementById('user-email-display').textContent = session.user.email;
            } else {
                authContainer.classList.remove('hidden');
                dashboardContainer.classList.add('hidden');
            }
        }
        checkUserSession();

        // Switch between Login and Register views
        function switchView(view) {
            if (view === 'register') {
                loginView.classList.add('hidden');
                registerView.classList.remove('hidden');
            } else {
                registerView.classList.add('hidden');
                loginView.classList.remove('hidden');
            }
        }

        // Login Handler (with preventDefault)
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Login Error: " + error.message);
            } else {
                alert("Login Successful!");
                checkUserSession();
            }
        });

        // Register Handler (with preventDefault)
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            const { data, error } = await supabase.auth.signUp({ email, password });

            if (error) {
                alert("Registration Error: " + error.message);
            } else {
                alert("Account created successfully! Now you can sign in.");
                switchView('login');
            }
        });

        // Logout Handler
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await supabase.auth.signOut();
            checkUserSession();
        });

        // ESG Form Submission Handler (esg_batches table)
        document.getElementById('esgForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const weight = parseFloat(document.getElementById('batch-weight').value);
            const carbon = document.getElementById('batch-carbon').value;
            const water = document.getElementById('batch-water').value;
            const energy = document.getElementById('batch-energy').value;

            const { data, error } = await supabase.from('esg_batches').insert([
                { weight: weight, carbon: carbon, water: water, energy: energy }
            ]);

            if (error) {
                alert("Database Error: " + error.message);
            } else {
                alert("ESG Batch successfully saved to database!");
                document.getElementById('esgForm').reset();
            }
        });
    </script>
</body>
</html>
