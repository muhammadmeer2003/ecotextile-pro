<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoTextile EU - Director Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white font-sans antialiased m-0 p-0 overflow-x-hidden">

    <!-- Mobile Backdrop Overlay -->
    <div id="backdrop" onclick="toggleMobileMenu()" class="fixed inset-0 bg-black/70 z-40 hidden md:hidden transition-opacity"></div>

    <div class="min-h-screen flex flex-col md:flex-row relative">
      
      <!-- Mobile Top Header Bar -->
      <div class="md:hidden bg-gray-900 border-b border-gray-800 p-4 flex items-center justify-between sticky top-0 z-30 shadow-md">
        <div>
          <h1 class="text-base font-bold text-emerald-400">EcoTextile EU</h1>
          <p class="text-xs text-gray-400">Director Portal</p>
        </div>
        <button 
          onclick="toggleMobileMenu()"
          id="menu-btn"
          class="px-3 py-1.5 rounded bg-gray-800 text-gray-200 text-sm font-medium focus:outline-none border border-gray-700 active:scale-95 transition-transform"
        >
          ☰ Menu
        </button>
      </div>

      <!-- Sidebar Navigation -->
      <aside id="sidebar" class="fixed top-0 bottom-0 left-0 z-50 w-72 bg-gray-900 border-r border-gray-800 p-4 flex flex-col transition-transform duration-300 ease-in-out -translate-x-full md:translate-x-0 md:static md:inset-auto shadow-2xl md:shadow-none">
        
        <!-- Sidebar Header (Desktop) -->
        <div class="hidden md:block mb-6">
          <h2 class="text-xl font-bold text-emerald-400">EcoTextile EU</h2>
          <p class="text-xs text-gray-400">Director Portal</p>
        </div>

        <!-- Mobile Header inside Sidebar -->
        <div class="flex md:hidden items-center justify-between mb-4 pb-3 border-b border-gray-800">
          <div>
            <h2 class="text-lg font-bold text-emerald-400">Navigation Menu</h2>
            <p class="text-[11px] text-gray-400">Select a module below</p>
          </div>
          <button onclick="toggleMobileMenu()" class="text-gray-400 hover:text-white p-1 text-sm font-bold">✕</button>
        </div>

        <!-- Sidebar Menu Items -->
        <nav class="space-y-1.5 flex-1 overflow-y-auto pr-1" id="nav-list">
          <!-- Populated by JS -->
        </nav>

        <div class="pt-4 mt-2 border-t border-gray-800 text-[11px] text-gray-500 text-center">
          EU Green Deal & ESPR Compliant
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="flex-1 p-4 md:p-8 overflow-y-auto bg-gray-950 w-full">
        <div class="max-w-6xl mx-auto">
          
          <!-- Header Banner -->
          <header class="mb-6 pb-4 border-b border-gray-800 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
              <span class="text-xs uppercase tracking-wider text-emerald-400 font-semibold bg-emerald-950/50 px-2.5 py-1 rounded-full border border-emerald-800/40">
                Active Compliance Module
              </span>
              <h2 id="module-title" class="text-xl md:text-3xl font-bold mt-2 text-white">
                1. Dashboard & Analytics
              </h2>
            </div>
            <div class="flex items-center gap-3">
              <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                ● Live System Sync
              </span>
            </div>
          </header>

          <!-- Module Card Content -->
          <div class="bg-gray-900/60 border border-gray-800/80 rounded-xl p-5 md:p-6 shadow-xl backdrop-blur-sm">
            <h3 class="text-lg font-semibold text-gray-200 mb-1">Module Overview</h3>
            <p id="module-desc" class="text-gray-400 text-sm mb-6">Overview of KPIs, carbon footprint, and production metrics.</p>

            <div id="module-content">
              <!-- Default Content -->
            </div>
          </div>

        </div>
      </main>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
      const modules = [
        { 
          id: 0, 
          title: "1. Dashboard & Analytics", 
          desc: "Overview of KPIs, carbon footprint, and production metrics under EU Green Deal guidelines." 
        },
        { 
          id: 1, 
          title: "2. Inventory & Excel Sheets", 
          desc: "Manage raw materials, organic cotton bales, and warehouse stock inventories." 
        },
        { 
          id: 2, 
          title: "3. EU Digital Product Passport", 
          desc: "Generate and track DPP compliance records, QR hashes, and circularity metrics." 
        },
        { 
          id: 3, 
          title: "4. Multi-Tier Supply Traceability", 
          desc: "Track supply chain transparency from Tier 3 (Farms) to Tier 1 (Stitching units)." 
        },
        { 
          id: 4, 
          title: "5. Advanced ESG & CSRD Report", 
          desc: "Sustainability metrics, carbon reporting, and European Union compliance audits." 
        },
        { 
          id: 5, 
          title: "6. Supabase Cloud Records", 
          desc: "Real-time cloud database synchronization, secure tokens, and immutable audit logs." 
        },
        { 
          id: 6, 
          title: "7. Production WIP Stages", 
          desc: "Work-in-progress tracking across spinning, weaving, wet processing, and dyeing." 
        },
        { 
          id: 7, 
          title: "8. Quality Control & Inspection", 
          desc: "4-point inspection system, fabric defect logs, and pass/fail QA thresholds." 
        },
        { 
          id: 8, 
          title: "9. BOM & Costing Sheet", 
          desc: "Bill of materials, chemical inputs breakdown, and financial cost modeling." 
        },
        { 
          id: 9, 
          title: "10. Warehouse Location Management", 
          desc: "Inventory warehouse storage bins, sector racks, and zone mapping." 
        },
        { 
          id: 10, 
          title: "11. Buyers Order & Dispatch", 
          desc: "European buyer export orders, container shipping status, and logistics tracking." 
        },
        { 
          id: 11, 
          title: "12. AI Operations Advisor", 
          desc: "AI-powered recommendations for textile energy efficiency and penalty risk mitigation." 
        }
      ];

      let activeTab = 0;
      let mobileMenuOpen = false;

      function renderNav() {
        const navList = document.getElementById('nav-list');
        navList.innerHTML = '';
        modules.forEach(mod => {
          const btn = document.createElement('button');
          btn.className = `w-full text-left px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${
            activeTab === mod.id
              ? 'bg-emerald-950/85 text-emerald-300 border border-emerald-800/50 shadow-sm'
              : 'text-gray-300 hover:bg-gray-800/60 hover:text-white'
          }`;
          btn.innerText = mod.title;
          btn.onclick = () => switchTab(mod.id);
          navList.appendChild(btn);
        });
      }

      function switchTab(id) {
        activeTab = id;
        if (window.innerWidth < 768) {
          toggleMobileMenu();
        }

        const mod = modules[id];
        document.getElementById('module-title').innerText = mod.title;
        document.getElementById('module-desc').innerText = mod.desc;

        const contentDiv = document.getElementById('module-content');
        
        // Render custom detailed UI based on selected tab index
        if (id === 0) {
          contentDiv.innerHTML = `
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
              <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                <p class="text-xs text-gray-400">Total Carbon Emission</p>
                <h4 class="text-xl font-bold text-emerald-400 mt-1">1,240 tCO2e</h4>
              </div>
              <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                <p class="text-xs text-gray-400">Active DPP Batches</p>
                <h4 class="text-xl font-bold text-emerald-400 mt-1">48 Units</h4>
              </div>
              <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                <p class="text-xs text-gray-400">ESG Compliance Score</p>
                <h4 class="text-xl font-bold text-emerald-400 mt-1">94.8%</h4>
              </div>
            </div>
            <div class="p-6 bg-gray-950/60 rounded-lg border border-gray-800">
              <h4 class="text-sm font-semibold text-emerald-300 mb-2">Executive Summary</h4>
              <p class="text-xs text-gray-400 leading-relaxed">System metrics indicate optimal compliance with ESPR guidelines. Real-time telemetry is active across all 3 production tiers in Karachi facility.</p>
            </div>`;
        } else if (id === 1) {
          contentDiv.innerHTML = `
            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs text-gray-300">
                <thead class="bg-gray-950 text-gray-400 uppercase border-b border-gray-800">
                  <tr>
                    <th class="p-3">Material ID</th>
                    <th class="p-3">Type</th>
                    <th class="p-3">Quantity (Kg)</th>
                    <th class="p-3">Status</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-800">
                  <tr><td class="p-3 font-medium text-white">MAT-101</td><td class="p-3">Organic Cotton</td><td class="p-3">4,500</td><td class="p-3 text-emerald-400">Verified EU</td></tr>
                  <tr><td class="p-3 font-medium text-white">MAT-102</td><td class="p-3">Recycled Polyester</td><td class="p-3">2,800</td><td class="p-3 text-emerald-400">Verified GRS</td></tr>
                </tbody>
              </table>
            </div>`;
        } else if (id === 2) {
          contentDiv.innerHTML = `
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="p-4 bg-gray-950 rounded-lg border border-gray-800">
                <span class="text-xs text-emerald-400 font-mono">DPP Hash: #EU-9942-TX</span>
                <h4 class="text-base font-bold text-white mt-1">Batch #48 - Summer Organic Line</h4>
                <p class="text-xs text-gray-400 mt-2">Circularity Index: 92% • Recyclability: High</p>
              </div>
              <div class="p-4 bg-gray-950 rounded-lg border border-gray-800 flex items-center justify-center">
                <span class="text-xs text-gray-400">[ QR Code Verification Active ]</span>
              </div>
            </div>`;
        } else {
          contentDiv.innerHTML = `
            <div class="p-8 text-center border border-dashed border-gray-800 rounded-lg bg-gray-950/30">
              <p class="text-gray-400 text-sm">
                Active enterprise workspace for <span class="text-emerald-300 font-medium">${mod.title}</span> is online and synchronized with live cloud records.
              </p>
            </div>`;
        }
        renderNav();
      }

      function toggleMobileMenu() {
        mobileMenuOpen = !mobileMenuOpen;
        const sidebar = document.getElementById('sidebar');
        const backdrop = document.getElementById('backdrop');
        const menuBtn = document.getElementById('menu-btn');
        
        if (mobileMenuOpen) {
          sidebar.classList.remove('-translate-x-full');
          backdrop.classList.remove('hidden');
          menuBtn.innerText = '✕ Close';
        } else {
          sidebar.classList.add('-translate-x-full');
          backdrop.classList.add('hidden');
          menuBtn.innerText = '☰ Menu';
        }
      }

      renderNav();
    </script>
</body>
</html>
